name: Deploy Jesse production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Staging-verified commit SHA
        required: true
      rollback_sha:
        description: Previous known-good commit SHA
        required: true
      staging_verified:
        description: Confirm controlled staging verification
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  production-approval:
    if: inputs.staging_verified == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Check out the trusted ref this workflow was dispatched from, NOT the dispatch input.
      # Code from an arbitrary input SHA must not run with default-branch cache write access
      # (CodeQL actions/cache-poisoning/poisonable-step). The input SHA is only verified below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit_sha is on the default branch
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::commit_sha must be a 7-40 character lowercase hex commit SHA"; exit 1
          fi
          if ! git rev-parse --verify --quiet "${REQUESTED_SHA}^{commit}" >/dev/null; then
            echo "::error::commit_sha was not found in this repository"; exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::commit_sha is not reachable from $DEFAULT_BRANCH"; exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate protected production plan
        run: >-
          python -m agents.jessie.cli deploy-production
          --commit-sha "${{ inputs.commit_sha }}"
          --rollback-sha "${{ inputs.rollback_sha }}"
          --confirm-production
          --staging-verified
          --verification-completed
          --backup-recorded
      - name: Deployment summary
        run: |
          echo '## Jesse production deployment approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Protected environment approval completed.' >> "$GITHUB_STEP_SUMMARY"
          echo "Selected commit: \\`${{ inputs.commit_sha }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback target: \\`${{ inputs.rollback_sha }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'External actions remain disabled until reviewed live adapters are implemented.' >> "$GITHUB_STEP_SUMMARY"
