name: Roll back Jesse

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Known-good commit SHA to restore
        required: true

permissions:
  contents: read

jobs:
  rollback-approval:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Check out the trusted ref this workflow was dispatched from, NOT the dispatch input.
      # Code from an arbitrary input SHA must not run with default-branch cache write access
      # (CodeQL actions/cache-poisoning/poisonable-step). The input SHA is only verified below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify target_sha is on the default branch
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::target_sha must be a 7-40 character lowercase hex commit SHA"; exit 1
          fi
          if ! git rev-parse --verify --quiet "${REQUESTED_SHA}^{commit}" >/dev/null; then
            echo "::error::target_sha was not found in this repository"; exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::target_sha is not reachable from $DEFAULT_BRANCH"; exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate rollback
        run: python -m agents.jessie.cli rollback --commit-sha "${{ inputs.target_sha }}" --confirm-production
      - name: Rollback summary
        run: |
          echo '## Jesse rollback event' >> "$GITHUB_STEP_SUMMARY"
          echo "Approved rollback target: \\`${{ inputs.target_sha }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'External action remains disabled in the v1 adapter.' >> "$GITHUB_STEP_SUMMARY"
